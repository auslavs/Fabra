name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Fabra.sln

      - name: Build
        run: dotnet build Fabra.sln -c Release --no-restore

      - name: Test
        run: dotnet test Fabra.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Fabra.fsproj -c Release --no-build
